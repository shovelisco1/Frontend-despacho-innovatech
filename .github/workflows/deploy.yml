name: CI/CD Frontend

on:
  push:
    branches:
      - deploy

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout del código
        uses: actions/checkout@v3

      - name: 2. Iniciar sesión en Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 3. Construir y Subir Imagen Docker
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: shovelisco/innovatech-frontend:latest

      - name: 4. Desplegar en Instancia EC2 Pública
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST_FRONTEND }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY_FRONTEND }}
          script: |
            cd /home/ubuntu

            # Escribir el archivo docker-compose directamente en el servidor
            cat << 'EOF' > docker-compose.yml
            version: '3.8'
            services:
              frontend:
                image: shovelisco/innovatech-frontend:latest
                container_name: web-frontend
                ports:
                  - "80:8080"
                networks:
                  - innovatech_front_net

            networks:
              innovatech_front_net:
                name: network_frontend_innovatech
            EOF

            # Detener contenedores anteriores (si existen), bajar la nueva imagen y encender
            sudo docker-compose down || true
            sudo docker pull shovelisco/innovatech-frontend:latest
            sudo docker-compose up -d
