name: CI/CD Frontend

on:
  push:
    branches:
      - deploy 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout del código
        uses: actions/checkout@v3

      - name: 2. Iniciar sesión en Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 3. Construir y Subir Imagen Docker
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: shovelisco/innovatech-frontend:latest

      - name: 4. Desplegar en Instancia EC2 Pública
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST_FRONTEND }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY_FRONTEND }}
          script: |
            cd /home/ubuntu
            sudo docker pull shovelisco/innovatech-frontend:latest
            sudo docker-compose down
            sudo docker-compose up -d